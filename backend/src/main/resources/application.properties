# Server Configuration
server.port=${PORT:8080}
spring.application.name=GirisimciTurk Mini Proje

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:8081}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.root=INFO
logging.level.com.girisimciturk=DEBUG

# Frontend Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:8081}

# Stripe Configuration
# UYARI: Bu degerler environment variable'lardan alinmalidir!
# Local development icin application-local.properties dosyasinda tanimlayin
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}


